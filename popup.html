<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Дипломы HAMLOG</title>
    <link rel="stylesheet" href="popup.css">
    <script src="callsign.js" defer></script>
    <script src="updates.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Дипломы HAMLOG</h1>
          <p id="callsign" class="callsign"></p>
        </div>
        <a id="settings" href="options.html">Настройки</a>
      </header>
      <p class="intro">Первая кнопка сверяет каталог с выданными дипломами. Вторая проверяет условия: HAMLOG может сразу выдать диплом.</p>
      <div class="actions">
        <button type="button" id="scan" disabled>Проверить дипломы</button>
        <button type="button" id="claim" disabled>Получить и скачать новые</button>
      </div>
      <p id="status" role="status" aria-live="polite">Загружаю настройки…</p>
      <p id="update-notice" hidden><a id="update-link" href="options.html"></a></p>
      <footer class="credits">
        <span>Разработчик <a id="developer-link" target="_blank" rel="noopener noreferrer">UB3DQY</a></span>
        <a id="project-link" target="_blank" rel="noopener noreferrer">GitHub</a>
      </footer>
    </main>
  </body>
</html>
